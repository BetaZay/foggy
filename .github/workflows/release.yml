name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish CalVer release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate release version
        run: |
          version="$(date -u +%Y).$(date -u +%-m).$GITHUB_RUN_NUMBER"
          echo "FOGGY_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building Foggy $version"

      - name: Validate service scripts
        run: npm run service:check

      - name: Build tested release archive
        run: npm run release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$FOGGY_RELEASE_VERSION" \
            "dist/foggy-$FOGGY_RELEASE_VERSION.tar.gz" \
            "dist/foggy-$FOGGY_RELEASE_VERSION.tar.gz.sha256" \
            "scripts/install-foggy.sh" \
            --generate-notes \
            --latest \
            --target "$GITHUB_SHA" \
            --title "Foggy $FOGGY_RELEASE_VERSION"
